server {
    listen      8081;
    listen      [::]:8081;

    server_name 103.72.57.149;

    root        /var/www/devops-hackathon-de01-phamcongthanh/src;
    index       index.html;

    access_log  /var/log/nginx/phamcongthanh-cntt1.access.log;
    error_log   /var/log/nginx/phamcongthanh-cntt1.error.log;

    location / {
        allow all;
        try_files $uri $uri/ =404;
    }
}
